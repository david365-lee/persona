apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: support-assistant
  annotations:
    nginx.org/proxy-read-timeout: 120s
    nginx.org/proxy-set-headers: "X-Forwarded-Proto: https, X-Forwarded-Port: 443"
    nginx.org/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: llmops.clush.cloud
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: support-assistant
                port:
                  number: 8000
