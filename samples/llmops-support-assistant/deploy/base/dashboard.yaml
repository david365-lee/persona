apiVersion: v1
kind: ConfigMap
metadata:
  name: llmops-support-dashboard
  labels:
    grafana_dashboard: "1"
data:
  llmops-support.json: |
    {
      "uid": "llmops-support", "title": "LLMOps Support Assistant", "schemaVersion": 39,
      "tags": ["llmops", "sample"], "refresh": "30s", "time": {"from": "now-1h", "to": "now"},
      "panels": [
        {"id": 1, "type": "timeseries", "title": "Requests / second by category", "gridPos": {"x": 0, "y": 0, "w": 12, "h": 8},
         "datasource": {"type": "prometheus", "uid": "prometheus"},
         "targets": [{"expr": "sum by (category, status) (rate(support_requests_total{namespace=\"llmops-sample\"}[5m]))", "legendFormat": "{{category}} / {{status}}"}]},
        {"id": 2, "type": "timeseries", "title": "p95 response latency (seconds)", "gridPos": {"x": 12, "y": 0, "w": 12, "h": 8},
         "datasource": {"type": "prometheus", "uid": "prometheus"},
         "targets": [{"expr": "histogram_quantile(0.95, sum by (le) (rate(support_latency_seconds_bucket{namespace=\"llmops-sample\"}[5m])))"}]},
        {"id": 3, "type": "stat", "title": "Served requests (current Pod)", "gridPos": {"x": 0, "y": 8, "w": 8, "h": 5},
         "datasource": {"type": "prometheus", "uid": "prometheus"},
         "targets": [{"expr": "sum(support_requests_total{namespace=\"llmops-sample\"})"}]},
        {"id": 4, "type": "stat", "title": "Provider failures (current Pod)", "gridPos": {"x": 8, "y": 8, "w": 8, "h": 5},
         "datasource": {"type": "prometheus", "uid": "prometheus"},
         "targets": [{"expr": "sum(support_requests_total{namespace=\"llmops-sample\",status=\"error\"}) or vector(0)"}]},
        {"id": 5, "type": "stat", "title": "Prometheus scrape health", "gridPos": {"x": 16, "y": 8, "w": 8, "h": 5},
         "datasource": {"type": "prometheus", "uid": "prometheus"},
         "targets": [{"expr": "up{namespace=\"llmops-sample\",service=\"support-assistant\"}"}]}
      ]
    }
