apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: llmops-sample
  namespace: argocd
spec:
  description: Only the support-assistant sample namespace
  sourceRepos:
    - https://gitlab.clush.cloud/root/llmops-support-assistant.git
  destinations:
    - namespace: llmops-sample
      server: https://kubernetes.default.svc
  namespaceResourceWhitelist:
    - group: apps
      kind: Deployment
    - group: ""
      kind: Service
    - group: ""
      kind: ConfigMap
    - group: networking.k8s.io
      kind: Ingress
    - group: monitoring.coreos.com
      kind: ServiceMonitor
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: llmops-support-assistant
  namespace: argocd
spec:
  project: llmops-sample
  source:
    repoURL: https://gitlab.clush.cloud/root/llmops-support-assistant.git
    targetRevision: main
    path: deploy/base
  destination:
    server: https://kubernetes.default.svc
    namespace: llmops-sample
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 1m
