apiVersion: batch/v1
kind: Job
metadata:
  name: milvus-root-password-update
  namespace: milvus
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: update-password
          image: python:3.12-slim
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: '1', memory: 768Mi}
          env:
            - name: OLD_PASSWORD
              valueFrom: {secretKeyRef: {name: milvus-admin-before-root, key: password}}
            - name: NEW_PASSWORD
              valueFrom: {secretKeyRef: {name: admin-rotation, key: password}}
          command: [bash, -ec]
          args:
            - |
              pip install --quiet --no-cache-dir pymilvus
              python - <<'PY'
              import os
              from pymilvus import MilvusClient
              uri='http://milvus.milvus.svc.cluster.local:19530'
              try:
                  client=MilvusClient(uri=uri,user='root',password=os.environ['NEW_PASSWORD'])
                  client.list_databases()
                  client.close()
              except Exception:
                  client=MilvusClient(uri=uri,user='root',password=os.environ['OLD_PASSWORD'])
                  client.update_password(user_name='root',old_password=os.environ['OLD_PASSWORD'],new_password=os.environ['NEW_PASSWORD'])
                  client.close()
              client=MilvusClient(uri=uri,user='root',password=os.environ['NEW_PASSWORD'])
              client.list_databases()
              client.close()
              print('Milvus root password changed and authenticated successfully',flush=True)
              PY
