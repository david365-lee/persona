apiVersion: v1
kind: Namespace
metadata:
  name: headlamp
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: root
  namespace: headlamp
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-root-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: root
    namespace: headlamp
---
apiVersion: v1
kind: Secret
metadata:
  name: headlamp-root-token
  namespace: headlamp
  annotations:
    kubernetes.io/service-account.name: root
type: kubernetes.io/service-account-token
