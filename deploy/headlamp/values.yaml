replicaCount: 1
image:
  tag: 'v0.46.0'
config:
  inCluster: true
  inClusterContextName: docker-desktop
  unsafeUseServiceAccountToken: false
  enableHelm: true
serviceAccount:
  create: true
  name: headlamp
clusterRoleBinding:
  create: false
service:
  type: ClusterIP
  port: 80
resources:
  requests: {cpu: 100m, memory: 128Mi}
  limits: {cpu: '1', memory: 512Mi}
ingress:
  enabled: true
  ingressClassName: nginx
  annotations:
    nginx.org/client-max-body-size: '0'
    nginx.org/proxy-read-timeout: '3600s'
    nginx.org/proxy-send-timeout: '3600s'
    nginx.org/proxy-set-headers: 'X-Forwarded-Proto: https, X-Forwarded-Port: 443'
    nginx.org/websocket-services: headlamp
    nginx.org/ssl-redirect: 'false'
  hosts:
    - host: headlamp.clush.cloud
      paths:
        - path: /
          type: Prefix
