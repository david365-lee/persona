apiVersion: v1
kind: Namespace
metadata:
  name: litellm
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: litellm
data:
  config.yaml: |
    model_list: []
    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: litellm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: litellm
  template:
    metadata:
      labels:
        app: litellm
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm:v1.106.3
          imagePullPolicy: IfNotPresent
          command: [litellm]
          args: [--config, /app/config.yaml, --port, "4000", --num_workers, "1"]
          ports:
            - name: http
              containerPort: 4000
          env:
            - name: STORE_MODEL_IN_DB
              value: "True"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: litellm-db
                  key: DATABASE_URL
            - name: LITELLM_SALT_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-db
                  key: LITELLM_SALT_KEY
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-auth
                  key: LITELLM_MASTER_KEY
            - name: UI_USERNAME
              valueFrom:
                secretKeyRef:
                  name: litellm-auth
                  key: UI_USERNAME
            - name: UI_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: litellm-auth
                  key: UI_PASSWORD
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /health/liveliness
              port: http
            periodSeconds: 10
            failureThreshold: 60
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/liveliness
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /app/config.yaml
              subPath: config.yaml
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: litellm-config
---
apiVersion: v1
kind: Service
metadata:
  name: litellm
  namespace: litellm
spec:
  type: ClusterIP
  selector:
    app: litellm
  ports:
    - name: http
      port: 4000
      targetPort: http
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-ui-redirect
  namespace: litellm
data:
  default.conf: |
    server {
      listen 8080;
      location = / {
        return 302 https://litellm.clush.cloud/ui/;
      }
      location / {
        return 404;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm-ui-redirect
  namespace: litellm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: litellm-ui-redirect
  template:
    metadata:
      labels:
        app: litellm-ui-redirect
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redirect
          image: nginxinc/nginx-unprivileged:1.29.3-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: litellm-ui-redirect
---
apiVersion: v1
kind: Service
metadata:
  name: litellm-ui-redirect
  namespace: litellm
spec:
  type: ClusterIP
  selector:
    app: litellm-ui-redirect
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: litellm
  namespace: litellm
  annotations:
    nginx.org/client-max-body-size: "0"
    nginx.org/proxy-read-timeout: 600s
    nginx.org/proxy-send-timeout: 600s
    nginx.org/proxy-set-headers: "X-Forwarded-Proto: https, X-Forwarded-Port: 443"
    nginx.org/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: litellm.clush.cloud
      http:
        paths:
          - path: /
            pathType: Exact
            backend:
              service:
                name: litellm-ui-redirect
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: litellm
                port:
                  number: 4000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: litellm-api
  namespace: litellm
  annotations:
    nginx.org/client-max-body-size: "0"
    nginx.org/proxy-read-timeout: 600s
    nginx.org/proxy-send-timeout: 600s
    nginx.org/proxy-set-headers: "X-Forwarded-Proto: https, X-Forwarded-Port: 443"
    nginx.org/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: llmapi.clush.cloud
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: litellm
                port:
                  number: 4000
